<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Deep Void Background -->
  <rect width="1920" height="1080" fill="#050505"/>
  
  <!-- Subtle Gradient Mesh (Top Left Glow) -->
  <defs>
    <radialGradient id="glow-top-left" cx="0" cy="0" r="1200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#151921" stop-opacity="1"/>
      <stop offset="1" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-bottom-right" cx="1920" cy="1080" r="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#glow-top-left)"/>
  <rect width="1920" height="1080" fill="url(#glow-bottom-right)"/>

  <!-- Technical Grid (Very Subtle) -->
  <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
    <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.1"/>
  </pattern>
  <rect width="1920" height="1080" fill="url(#grid)"/>

  <!-- Connecting Nodes / Constellations (Abstract Data) -->
  <g opacity="0.15">
    <circle cx="200" cy="200" r="2" fill="#38bdf8"/>
    <circle cx="250" cy="350" r="2" fill="#38bdf8"/>
    <circle cx="500" cy="150" r="3" fill="#38bdf8"/>
    <line x1="200" y1="200" x2="250" y2="350" stroke="#38bdf8" stroke-width="1"/>
    <line x1="200" y1="200" x2="500" y2="150" stroke="#38bdf8" stroke-width="1"/>
    
    <circle cx="1600" cy="800" r="2" fill="#10b981"/>
    <circle cx="1700" cy="900" r="3" fill="#10b981"/>
    <line x1="1600" y1="800" x2="1700" y2="900" stroke="#10b981" stroke-width="1"/>
  </g>

  <!-- Vignette -->
  <rect width="1920" height="1080" fill="radial-gradient(circle at 50% 50%, transparent 50%, #000000 100%)" opacity="0.6"/>
</svg>