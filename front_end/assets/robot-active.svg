<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Base Chassis -->
  <rect x="50" y="150" width="100" height="30" rx="5" fill="#1a1a1a" stroke="#00ff41" stroke-width="2"/>
  <circle cx="70" cy="180" r="10" fill="#333" stroke="#00ff41"/>
  <circle cx="130" cy="180" r="10" fill="#333" stroke="#00ff41"/>
  
  <!-- Robot Arm Segments -->
  <path d="M100 150 L100 100" stroke="#555" stroke-width="8" stroke-linecap="round"/>
  <circle cx="100" cy="100" r="8" fill="#333" stroke="#00ff41"/>
  
  <path d="M100 100 L140 60" stroke="#555" stroke-width="6" stroke-linecap="round"/>
  <circle cx="140" cy="60" r="6" fill="#333" stroke="#00ff41"/>
  
  <!-- Manipulator Claw -->
  <path d="M140 60 L130 40 M140 60 L150 40" stroke="#00ff41" stroke-width="3"/>
  
  <!-- Status Light (Green) -->
  <circle cx="100" cy="140" r="4" fill="#00ff41" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- HUD Elements -->
  <text x="10" y="20" font-family="monospace" font-size="10" fill="#00ff41">ROBOT #01</text>
  <text x="10" y="35" font-family="monospace" font-size="10" fill="#00ff41">STATUS: ACTIVE</text>
  
  <!-- Target Reticle -->
  <rect x="120" y="30" width="40" height="40" stroke="#00ff41" stroke-width="1" stroke-dasharray="2 2" opacity="0.5"/>
</svg>