<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Base Chassis (Red Tint) -->
  <rect x="50" y="150" width="100" height="30" rx="5" fill="#1a1a1a" stroke="#ff4500" stroke-width="2"/>
  <circle cx="70" cy="180" r="10" fill="#333" stroke="#ff4500"/>
  <circle cx="130" cy="180" r="10" fill="#333" stroke="#ff4500"/>
  
  <!-- Robot Arm Segments (Jagged/Alert) -->
  <path d="M100 150 L110 120" stroke="#555" stroke-width="8" stroke-linecap="round"/>
  <circle cx="110" cy="120" r="8" fill="#333" stroke="#ff4500"/>
  
  <path d="M110 120 L150 130" stroke="#555" stroke-width="6" stroke-linecap="round"/>
  <circle cx="150" cy="130" r="6" fill="#333" stroke="#ff4500"/>
  
  <!-- Manipulator Claw (Stuck/Broken) -->
  <path d="M150 130 L160 145 M150 130 L140 145" stroke="#ff4500" stroke-width="3"/>
  
  <!-- Status Light (Red Blink) -->
  <circle cx="100" cy="140" r="4" fill="#ff4500" opacity="1">
    <animate attributeName="opacity" values="1;0;1;0" dur="0.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Alert Overlay -->
  <text x="10" y="20" font-family="monospace" font-size="10" fill="#ff4500">ROBOT #01</text>
  <text x="10" y="35" font-family="monospace" font-size="10" fill="#ff4500" font-weight="bold">ERROR: STUCK</text>
  
  <!-- Glitch Elements -->
  <rect x="140" y="120" width="20" height="2" fill="#ff4500" opacity="0.8"/>
  <rect x="145" y="125" width="10" height="2" fill="#ff4500" opacity="0.8"/>
  
  <!-- Warning Triangle (Small) -->
  <path d="M180 20 L190 40 H170 L180 20Z" stroke="#ff4500" fill="none" stroke-width="2"/>
  <text x="178" y="38" font-family="monospace" font-size="12" fill="#ff4500">!</text>
</svg>