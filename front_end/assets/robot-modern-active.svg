<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Container Shape (Card-like) -->
  <defs>
    <filter id="glow-green" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5"/>
    </filter>
  </defs>

  <rect x="20" y="20" width="160" height="160" rx="20" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Icon: Abstract Robot Arm / Node (Active) -->
  <g transform="translate(100, 100)">
    <!-- Central Pivot -->
    <circle r="15" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="2"/>
    <circle r="6" fill="#10b981"/>

    <!-- Orbital Ring -->
    <circle r="45" stroke="#334155" stroke-width="2" stroke-dasharray="10 10" opacity="0.5">
       <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="10s" repeatCount="indefinite"/>
    </circle>

    <!-- Arms -->
    <line x1="0" y1="0" x2="35" y2="-35" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="35" cy="-35" r="5" fill="#334155"/>
    
    <line x1="35" y1="-35" x2="60" y2="-20" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Claw -->
    <path d="M60 -20 L70 -30 M60 -20 L70 -10" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Status Badge (Top Right) -->
  <circle cx="160" cy="40" r="6" fill="#10b981" filter="url(#glow-green)"/>
  <circle cx="160" cy="40" r="3" fill="#ffffff"/>

  <!-- Label -->
  <text x="100" y="160" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="12" fill="#94a3b8" letter-spacing="1">ACTIVE</text>
</svg>